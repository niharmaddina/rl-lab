# DQN on CartPole-v1.
# The 2024 script (CartPole/main.py) used DQN("MlpPolicy", env) with SB3 defaults
# and total_timesteps=100000. The policy and the 100k budget are kept; the
# algorithm kwargs below are the rl-baselines3-zoo CartPole-v1 DQN values,
# because the SB3 defaults (lr 1e-4, target update every 10k steps, 1M buffer)
# are tuned for Atari and learn slowly and unstably on CartPole.
env: CartPole-v1
algo: dqn
timesteps: 100000
n_envs: 1
eval_episodes: 20
eval_seed_base: 10000
algo_kwargs:
  policy: MlpPolicy
  learning_rate: 2.3e-3
  batch_size: 64
  buffer_size: 100000
  learning_starts: 1000
  gamma: 0.99
  target_update_interval: 10
  train_freq: 256
  gradient_steps: 128
  exploration_fraction: 0.16
  exploration_final_eps: 0.04
  policy_kwargs:
    net_arch: [256, 256]
