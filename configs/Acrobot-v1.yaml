# DQN on Acrobot-v1 (second discrete-control task; chosen over MountainCar-v0
# because DQN with a plain epsilon-greedy schedule reliably learns Acrobot in
# 100k steps, while MountainCar's sparse reward usually needs more exploration
# machinery than this repo ships). Kwargs are the rl-baselines3-zoo values.
env: Acrobot-v1
algo: dqn
timesteps: 100000
n_envs: 1
eval_episodes: 20
eval_seed_base: 10000
algo_kwargs:
  policy: MlpPolicy
  learning_rate: 6.3e-4
  batch_size: 128
  buffer_size: 50000
  learning_starts: 0
  gamma: 0.99
  target_update_interval: 250
  train_freq: 4
  gradient_steps: -1
  exploration_fraction: 0.12
  exploration_final_eps: 0.1
  policy_kwargs:
    net_arch: [256, 256]
